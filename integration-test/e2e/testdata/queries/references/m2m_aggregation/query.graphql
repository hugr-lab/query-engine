{
  pg_store {
    products(order_by: [{ field: "id", direction: ASC }]) {
      id
      product_tags_aggregation {
        _rows_count
        name { list(distinct: true) }
      }
      product_tags_bucket_aggregation {
        key { name }
        aggregations { _rows_count }
      }
    }
    tags(order_by: [{ field: "id", direction: ASC }]) {
      id
      tagged_products_aggregation {
        _rows_count
      }
    }
  }
}
