directive @system on OBJECT | INTERFACE | UNION | INPUT_OBJECT | ENUM | FIELD_DEFINITION | SCALAR

# This directive mark type as module root object, thats fields is queries, mutations or functions
# This directive is generated by the compiler as well as module types
directive @module_root(name: String!, type: ModuleObjectType!) on OBJECT

# Original name of the object in the catalog, before prefix was added
# This directive is used generated by the compiler to keep the original name of the object
directive @original_name(name: String!) on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR | FIELD_DEFINITION

extend type __Type {
	hugr_type: String
	module: String
	catalog: String
}

extend type __Field {
	hugr_type: String
	catalog: String
	mcp_exclude: Boolean
	"""
	What the field IS, for a data object: column — a stored value;
	relation — a path to another data object; extra — derived from something
	else (an @extra_field companion, a @sql expression, a function call, an
	aggregation twin). Null on types that are not data objects.
	"""
	field_kind: String
}

enum ModuleObjectType @system {
	QUERY
	MUTATION
	FUNCTION
	MUT_FUNCTION
	SUBSCRIPTION
}

input OrderByField @system {
	field: String!
	direction: OrderDirection = ASC
}

enum OrderDirection @system {
	ASC
	DESC
}

type OperationResult @system {
	success: Boolean
	affected_rows: BigInt
	last_id: BigInt
	message: String
}

schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}

type Query @system {
	"""
	Performs jq query on result set
	Results will be placed in 'extension' field by field or alias name
	"""
	jq(query: String!, include_origin: Boolean = false): Query @system

	function: Function @system

	"""
	H3 aggregation query
	"""
	h3(
		"""
		H3 resolution to use for the query
		"""
		resolution: Int!
	): [_h3_query] @system

	"""
	Logical-model introspection: the root module tree (name "").
	Resolved on the metadata path, like __schema/__type.
	"""
	_catalog: _Module @system

	"""
	Logical-model introspection: direct module lookup; "" = the root module.
	"""
	_module(name: String!): _Module @system

	"""
	Logical-model introspection: data object by GraphQL type name;
	null for non-data-object types.
	"""
	_dataObject(name: String!): _DataObject @system

	"""
	Logical-model introspection: callable member (function/mutation/subscription)
	of a module; module "" = root-level functions.
	"""
	_function(module: String!, name: String!): _Function @system

	"""
	Logical-model introspection: the attached data sources that contribute
	anything visible to the caller.
	"""
	_dataSources: [_DataSource!] @system

	"""
	Logical-model introspection: data source by name; null when absent,
	inactive or contributing nothing visible.
	"""
	_dataSource(name: String!): _DataSource @system

	"""
	Logical-model introspection: GraphQL type definitions of the logical
	model. SOURCE (default) lists the residual base types defined by data
	sources — structural objects, inputs, enums — excluding data objects,
	module roots and compiler-generated helper types; SYSTEM lists the
	engine-defined types (scalars, introspection and hugr system SDL).
	"""
	_types(scope: _TypeScope = SOURCE): [__Type!] @system

	"""
	Logical-model search: rank modules, data sources, data objects, functions
	and fields by relevance to a natural-language query. Semantic when the
	deployment has a vector index, lexical otherwise — see
	_SearchResult.lexical. Results are filtered to what the caller may see, by
	the same rules as _catalog.

	This searches the MODEL, never the data.
	"""
	_search(
		"Natural-language description of what you are looking for."
		query: String!
		"Restrict to these kinds; null or empty means all of them."
		kinds: [_SearchKind!]
		"""
		Restrict to this module's SUBTREE; "" (the default) is the root module
		and therefore the whole tree. Data sources are not module-scoped — a
		source contributes to several — so DATA_SOURCE hits ignore this.
		"""
		module: String
		"Restrict FIELD hits to one data object; ignored by the other kinds."
		object: String
		"""
		WHAT to match on. Searching by NAME and searching by MEANING are
		different questions and rank on scales that do not compare, which is
		why they are selected rather than blended:

		NAME — substring matching over the entity's name. Always available,
		needs no embedder, and is the only way to find an identifier: a name
		never enters the vector index, which embeds DESCRIPTIONS.

		MEANING — semantic ranking over descriptions, degrading to substring
		matching when the deployment has no vector index (see lexical).

		BOTH (the default) — name matches first, then meaning, deduplicated.
		Each hit says which one found it.
		"""
		match: _SearchMatch = BOTH
		"Page size, 1..200."
		limit: Int = 50
		"Hits to skip."
		offset: Int = 0
		"""
		Drop MEANING hits scoring below this (0..1). Name-track hits rank on a
		scale of their own and are never thresholded: a bar tuned for semantic
		similarity must not silently delete the identifier the caller typed.
		"""
		minScore: Float
		"""
		Include fields marked @exclude_mcp. That directive is a client policy
		for AI tooling, not an access rule, so it is opt-out rather than
		enforced: MCP passes false, everything else wants the default.
		"""
		includeMcpExcluded: Boolean = true
	): _SearchResult @system
}

type Mutation @system {
	function: MutationFunction @system
}

type Subscription @system {
	"Stream results of a regular query. If interval is set, re-executes periodically."
	query(
		"Re-execution interval. If unset, query executes once and streams results."
		interval: Interval
		"Max number of executions. 0 = unlimited (until client cancels)."
		count: Int = 0
	): Query @system
}

type Function @system {
	_stub: String
}

type MutationFunction @system {
	_stub: String
}

type _join @system {
	_stub: String
}

type _join_aggregation @aggregation(name: "_join", is_bucket: false, level: 1) {
	_stub: String
}

type _spatial @system {
	_stub: String
}

type _spatial_aggregation @aggregation(name: "_spatial", is_bucket: false, level: 1) {
	_stub: String
}

type _h3_data_query @system {
	_stub: String
}

type _h3_query @system {
	"""
	The H3 cell
	"""
	cell: H3Cell!
	"""
	The resolution of the H3 cell
	"""
	resolution: Int!
	"""
	The geometry representation of the H3 cell
	"""
	geom: Geometry!
	"""
	The data associated with the H3 cell
	"""
	data: _h3_data_query!
	"""
	Calculate distributed aggregated value
	"""
	distribution_by(
		"""
		Path to numerator aggregated value
		"""
		numerator: String!
		"""
		Path to denominator aggregated value
		"""
		denominator: String!
	): _distribution_by
	"""
	Calculate distributed aggregated value across denominator buckets
	"""
	distribution_by_bucket(
		"""
		Path to bucket key in numerator bucket aggregation
		"""
		numerator_key: String
		"""
		Path to numerator aggregated value
		"""
		numerator: String!
		"""
		Path to bucket key in denominator bucket aggregation
		"""
		denominator_key: String!
		"""
		Path to denominator aggregated value in bucket aggregations
		"""
		denominator: String!
	): [_distribution_by_bucket]
}

