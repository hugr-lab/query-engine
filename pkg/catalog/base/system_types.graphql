# --- hugr logical-model introspection (_catalog meta-query family) ---
# The root meta queries (_catalog / _module / _dataObject / _function) are
# declared on the Query type above; they are resolved on the metadata path,
# like __schema/__type, and never planned as data queries.

"""
The scope of logical-model type listings: SOURCE — residual base types
defined by data sources; SYSTEM — engine-defined types. Compiler-derived
types (filters, aggregations, mutation inputs, module roots) belong to
neither scope.
"""
enum _TypeScope @system {
	SOURCE
	SYSTEM
}

"""
The kind of a data object.
"""
enum _DataObjectType @system {
	TABLE
	VIEW
}

"""
The kind of a callable module member.
"""
enum _FunctionType @system {
	FUNCTION
	MUTATION
	SUBSCRIPTION
}

"""
The kind of a query generated for a data object: SELECT — the row-set query;
SELECT_ONE — a single-row lookup, by the primary key or by any unique key
(@unique); AGGREGATION — the whole-set aggregate; BUCKET_AGGREGATION — the
grouped aggregate. An object may have SEVERAL SELECT_ONE queries; the key each
one uses is its argument list.
"""
enum _QueryType @system {
	SELECT
	SELECT_ONE
	AGGREGATION
	BUCKET_AGGREGATION
}

"""
The perspective of a relation entry: FORWARD — the viewed object is the source
of the edge; BACK — the viewed object is the destination.
"""
enum _RelationDirection @system {
	FORWARD
	BACK
}

"""
The nature of a relation edge. JOIN edges are one-directional (always FORWARD).
"""
enum _RelationKind @system {
	FK
	M2M
	JOIN
}

"""
An attached data source, as a logical entity: what it is and what it
contributes. Connection details (the registry's type and path — a path is a
DSN) are deliberately NOT exposed.
"""
type _DataSource @system {
	"""The data source name (@catalog name)."""
	name: String!
	"""The source's engine type string."""
	engine: String
	description: String
	"""Curated/summarized long description."""
	longDescription: String
	"""Mutations are not generated for this source."""
	readOnly: Boolean!
	"""The source is exposed as a module of its own."""
	asModule: Boolean!
	"""The source extends other sources' objects."""
	isExtension: Boolean!
	"""Modules this source places members in; "" is the root module."""
	modules: [String!]!
}

"""
A node in hugr's logical module tree. The root module has name "" and owns
everything attached directly to Query/Mutation/Subscription/Function/MutationFunction.
"""
type _Module @system {
	"""Full dotted module name; empty string for the root module."""
	name: String!
	description: String
	"""Curated/summarized long description."""
	longDescription: String
	"""Distinct data sources contributing this module's direct members."""
	dataSources: [String!]!
	"""Direct child modules only; children with no visible content are omitted."""
	modules: [_Module!]
	"""Data objects whose @module is this module (root: objects without @module)."""
	dataObjects: [_DataObject!]
	"""All callable members, including SUBSCRIPTION kind."""
	functions: [_Function!]
	"""The module's generated query root type (root module: Query)."""
	queryType: __Type
	"""The module's generated mutation root type (root module: Mutation)."""
	mutationType: __Type
	"""The module's generated subscription root type (root module: Subscription)."""
	subscriptionType: __Type
	"""The module's generated function root type (root module: Function)."""
	functionType: __Type
	"""The module's generated mutation-function root type (root module: MutationFunction)."""
	mutationFunctionType: __Type
}

"""
Extensible property flags of a data object. Adding a flag is a backward-compatible change.
"""
type _DataObjectProperties @system {
	"""Declared as an aggregation cube (@cube)."""
	isCube: Boolean!
	"""A many-to-many junction table (@table(is_m2m: true))."""
	isM2M: Boolean!
	"""A hypertable (@hypertable)."""
	isHypertable: Boolean!
	"""Soft-delete semantics enabled (@table(soft_delete: true))."""
	softDelete: Boolean!
	"""Has Vector-typed fields (semantic search capable)."""
	hasVectors: Boolean!
}

"""
A table or view as a logical entity of the hugr data model.
"""
type _DataObject @system {
	"""GraphQL type name (source-prefixed, globally unique)."""
	name: String!
	type: _DataObjectType!
	properties: _DataObjectProperties!
	description: String
	longDescription: String
	"""Owning module's dotted name; empty string for the root module."""
	moduleName: String!
	"""Owning module (recursive back-reference, depth-budgeted)."""
	module: _Module
	"""Field names carrying @pk; empty when the object has no primary key."""
	primaryKey: [String!]!
	"""Parameterized-view arguments; null when the object is not parameterized."""
	args: [__InputValue!]
	"""
	The generated query fields that return this object (permission-filtered).
	These are the names to write in a GraphQL query.
	"""
	queries: [_DataObjectQuery!]
	"""The object's fields (permission-filtered, same rules as __Type.fields)."""
	fields: [__Field!]
	"""Logical links to other data objects (both directions; hidden endpoints excluded)."""
	relations: [_Relation!]
	"""The OWNING data source."""
	dataSourceName: String!
	"""All contributing sources: owner + declarers of extension-added fields."""
	dataSources: [String!]!
}

"""
A generated query field that returns a data object — the callable entry point
for reading it.
"""
type _DataObjectQuery @system {
	"""Field name to write in GraphQL — copy verbatim."""
	name: String!
	type: _QueryType!
	"""The generated root type hosting this field (the owning module's query root)."""
	rootTypeName: String!
	"""Client-facing arguments; server-injected @arg_default arguments are excluded."""
	args: [__InputValue!]
}

"""
One perspective on a logical edge between two data objects. Relation SQL is never exposed.
"""
type _Relation @system {
	"""Relation name (@references(name:)) or the join field name."""
	name: String!
	direction: _RelationDirection!
	kind: _RelationKind!
	"""The field on the VIEWED object that materializes this edge."""
	fieldName: String
	"""Per-endpoint description (same perspective rule as fieldName)."""
	description: String
	"""The FAR data object (for M2M: the far leg, not the junction)."""
	dataObject: _DataObject
	"""M2M only: the junction data object; null otherwise."""
	through: _DataObject
	"""Key field mappings on the source side (M2M: the source junction leg)."""
	sourceKeys: [String!]!
	"""Key field mappings on the destination side (M2M: the destination junction leg)."""
	destinationKeys: [String!]!
	"""The data source declaring this edge (cross-source edges are visible)."""
	dataSource: String
}

"""
A callable member of a module: a query function, a mutation, or a subscription.
"""
type _Function @system {
	"""Field name on the module's function/mutation-function/subscription root type."""
	name: String!
	type: _FunctionType!
	description: String
	longDescription: String
	"""Owning module's dotted name; empty string for root-level functions."""
	moduleName: String!
	"""Owning module (recursive back-reference, depth-budgeted)."""
	module: _Module
	"""Client-facing arguments; server-injected @arg_default arguments are excluded."""
	args: [__InputValue!]
	returns: __Type
	"""True when the function returns a row set (table function) rather than a scalar."""
	isTable: Boolean!
	"""The owning data source."""
	dataSourceName: String
}
# --- logical-model search (_search) ---

"""
What a search matches on. See the `match` argument of `_search`.

NAME and MEANING rank on scales that do not compare — an exact identifier
against an embedding distance — which is why a search selects one or asks for
BOTH and gets them concatenated, name matches first, rather than blended.
"""
enum _SearchMatch @system {
	NAME
	MEANING
	BOTH
}

"""
What kind of logical entity a search hit is.
"""
enum _SearchKind @system {
	MODULE
	DATA_SOURCE
	DATA_OBJECT
	FUNCTION
	FIELD
}

"""
A ranked search result page.

It carries NO total: the permission filter runs AFTER ranking, so an honest
total would mean scanning the whole index on every query. filteredOut reports
what the filter removed from the candidates actually examined — enough to tell
"nothing matches" from "nothing you may see matches".
"""
type _SearchResult @system {
	items: [_SearchHit!]!
	limit: Int!
	offset: Int!
	"""More hits exist past this page, or candidates were left unverified."""
	hasMore: Boolean!
	"""Candidates dropped because the caller may not see them."""
	filteredOut: Int!
	"""
	True when the MEANING track fell back to substring matching because the
	vector index was unusable: those results are cruder, so prefer exact terms.
	Always false for match: NAME, where substring matching is the point rather
	than a fallback.
	"""
	lexical: Boolean!
	"""Why the vector index was unusable; null when it was used."""
	lexicalReason: String
}

"""
One ranked hit. The scalar fields identify it; the object fields resolve it
through the ordinary _catalog resolvers, so a client pays for detail only by
selecting it.
"""
type _SearchHit @system {
	kind: _SearchKind!
	"""
	Which track found this hit — NAME or MEANING, never BOTH. Scores are
	comparable within a track and not across them.
	"""
	matchedOn: _SearchMatch!
	"""
	Module: dotted path ("" is the root). Data source: source name. Data
	object: GraphQL type name. Function: field name in its module. Field:
	field name on its data object.
	"""
	name: String!
	"""Owning module's dotted name; "" for the root. Empty for DATA_SOURCE."""
	moduleName: String!
	"""Owning data source; null for MODULE hits."""
	dataSourceName: String
	description: String
	"""0..1, higher is better. Lexical scores are coarse."""
	score: Float!

	"""FIELD hits only: the data object this field belongs to."""
	objectName: String
	"""FIELD hits only: the field's GraphQL type, SDL spelling ("String!", "[Int]")."""
	type: String
	"""
	FIELD hits only: what the field IS in hugr's model — the same vocabulary
	__Field.hugr_type answers in. What the INDEX can hold is column (a stored
	value), calculated (@sql), function (@function_call or a table-function
	join) and select (a declared @join, which is a path — refObjectName says
	where to). Relation navigation fields and @extra_field companions are
	generated when the GraphQL type is built, so they are never in the index
	and never a hit.
	"""
	hugrType: String
	"""FIELD hits only: for a @join, the data object it navigates to."""
	refObjectName: String

	"""The module itself, for a MODULE hit; null otherwise."""
	module: _Module
	"""The data object, for a DATA_OBJECT hit; null otherwise."""
	dataObject: _DataObject
	"""The function, for a FUNCTION hit; null otherwise."""
	function: _Function
	"""The data source, for a DATA_SOURCE hit; null otherwise."""
	dataSource: _DataSource
	"""The field definition, for a FIELD hit; null otherwise."""
	field: __Field
}
