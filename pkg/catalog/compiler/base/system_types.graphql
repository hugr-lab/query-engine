directive @system on OBJECT | INTERFACE | UNION | INPUT_OBJECT | ENUM | FIELD_DEFINITION | SCALAR

# This directive mark type as module root object, thats fields is queries, mutations or functions
# This directive is generated by the compiler as well as module types
directive @module_root(name: String!, type: ModuleObjectType!) on OBJECT

# Original name of the object in the catalog, before prefix was added
# This directive is used generated by the compiler to keep the original name of the object
directive @original_name(name: String!) on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR | FIELD_DEFINITION

extend type __Type {
	hugr_type: String
	module: String
	catalog: String
}

extend type __Field {
	hugr_type: String
	catalog: String
	mcp_exclude: Boolean
}

enum ModuleObjectType @system {
	QUERY
	MUTATION
	FUNCTION
	MUT_FUNCTION
	SUBSCRIPTION
}

input OrderByField @system {
	field: String!
	direction: OrderDirection = ASC
}

enum OrderDirection @system {
	ASC
	DESC
}

type OperationResult @system {
	success: Boolean
	affected_rows: BigInt
	last_id: BigInt
	message: String
}

schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}

type Query @system {
	"""
	Performs jq query on result set
	Results will be placed in 'extension' field by field or alias name
	"""
	jq(query: String!, include_origin: Boolean = false): Query @system

	function: Function @system

	"""
	H3 aggregation query
	"""
	h3(
		"""
		H3 resolution to use for the query
		"""
		resolution: Int!
	): [_h3_query] @system

	"""
	Logical-model introspection: the root module tree (name "").
	Resolved on the metadata path, like __schema/__type.
	"""
	_catalog: _Module @system

	"""
	Logical-model introspection: direct module lookup; "" = the root module.
	"""
	_module(name: String!): _Module @system

	"""
	Logical-model introspection: data object by GraphQL type name;
	null for non-data-object types.
	"""
	_dataObject(name: String!): _DataObject @system

	"""
	Logical-model introspection: callable member (function/mutation/subscription)
	of a module; module "" = root-level functions.
	"""
	_function(module: String!, name: String!): _Function @system
}

type Mutation @system {
	function: MutationFunction @system
}

type Subscription @system {
	"Stream results of a regular query. If interval is set, re-executes periodically."
	query(
		"Re-execution interval. If unset, query executes once and streams results."
		interval: Interval
		"Max number of executions. 0 = unlimited (until client cancels)."
		count: Int = 0
	): Query @system
}

type Function @system {
	_stub: String
}

type MutationFunction @system {
	_stub: String
}

type _join @system {
	_stub: String
}

type _join_aggregation @aggregation(name: "_join", is_bucket: false, level: 1) {
	_stub: String
}

type _spatial @system {
	_stub: String
}

type _spatial_aggregation @aggregation(name: "_spatial", is_bucket: false, level: 1) {
	_stub: String
}

type _h3_data_query @system {
	_stub: String
}

type _h3_query @system {
	"""
	The H3 cell
	"""
	cell: H3Cell!
	"""
	The resolution of the H3 cell
	"""
	resolution: Int!
	"""
	The geometry representation of the H3 cell
	"""
	geom: Geometry!
	"""
	The data associated with the H3 cell
	"""
	data: _h3_data_query!
	"""
	Calculate distributed aggregated value
	"""
	distribution_by(
		"""
		Path to numerator aggregated value
		"""
		numerator: String!
		"""
		Path to denominator aggregated value
		"""
		denominator: String!
	): _distribution_by
	"""
	Calculate distributed aggregated value across denominator buckets
	"""
	distribution_by_bucket(
		"""
		Path to bucket key in numerator bucket aggregation
		"""
		numerator_key: String
		"""
		Path to numerator aggregated value
		"""
		numerator: String!
		"""
		Path to bucket key in denominator bucket aggregation
		"""
		denominator_key: String!
		"""
		Path to denominator aggregated value in bucket aggregations
		"""
		denominator: String!
	): [_distribution_by_bucket]
}

# generated directives
directive @filter_input(name: String!) on OBJECT | INPUT_OBJECT
directive @filter_list_input(name: String!) on OBJECT | INPUT_OBJECT
directive @data_input(name: String!) on OBJECT | INPUT_OBJECT

directive @query(name: String, type: QueryType) on OBJECT | FIELD_DEFINITION
directive @mutation(name: String, type: MutationType, data_input: String!) on OBJECT | FIELD_DEFINITION
directive @catalog(name: String!, engine: String!) on OBJECT | INPUT_OBJECT | FIELD_DEFINITION | INPUT_FIELD_DEFINITION
directive @subscription on FIELD_DEFINITION
directive @aggregation(name: String!, is_bucket: Boolean, level: Int) on OBJECT
directive @field_aggregation(name: String!) on OBJECT | FIELD_DEFINITION
directive @aggregation_query(name: String!, is_bucket: Boolean) on FIELD_DEFINITION

directive @extra_field(name: String!, base_field: String!, base_type: ExtraFieldBaseType!) on FIELD_DEFINITION

enum ExtraFieldBaseType @system {
	Timestamp
	DateTime
	Geometry
}


enum QueryType @system {
	SELECT
	SELECT_ONE
}

enum MutationType @system {
	INSERT
	UPDATE
	DELETE
}

enum GeometryType @system {
	POINT
	LINESTRING
	POLYGON
	MULTIPOINT
	MULTILINESTRING
	MULTIPOLYGON
	GEOMETRYCOLLECTION
}

"""
Value distribution data type
"""
type _distribution_by @system {
	# distributed value - numerator * ratio
	value: Float
	# ratio of the value denominator / denominator_total
	ratio: Float
	# non-distributed value - numerator
	numerator: Float
	# distribution base value - denominator
	denominator: Float
	# total value for the denominator, used for ratio calculation
	denominator_total: Float
}

"""
Value distribution aggregation data type
"""
type _distribution_by_aggregation @system {
	# distributed value - numerator * ratio
	value: FloatAggregation
	# ratio of the value denominator / denominator_total
	ratio: FloatAggregation
	# non-distributed value - numerator
	numerator: FloatAggregation
	# distribution base value - denominator
	denominator: FloatAggregation
	# total value for the denominator, used for ratio calculation
	denominator_total: FloatAggregation
}

"""
Value distribution bucket data type
This type is used to store distribution data in buckets.
"""
type _distribution_by_bucket @system{
	# numerator bucket key
	numerator_key: JSON
	# denominator bucket key
	denominator_key: JSON
	# distributed value - numerator * ratio
	value: Float
	# ratio of the value denominator / denominator_total
	ratio: Float
	# non-distributed value - numerator
	numerator: Float
	# distribution base value - denominator
	denominator: Float
	# total value for the denominator, used for ratio calculation
	denominator_total: Float
}

"""
Value distribution bucket aggregation data type
"""
type _distribution_by_bucket_aggregation @system {
	# bucket key
	key: JSONAggregation
	# distributed value - numerator * ratio
	value: FloatAggregation
	# ratio of the value denominator / denominator_total
	ratio: FloatAggregation
	# non-distributed value - numerator
	numerator: FloatAggregation
	# distribution base value - denominator
	denominator: FloatAggregation
	# total value for the denominator, used for ratio calculation
	denominator_total: FloatAggregation
}

# --- hugr logical-model introspection (_catalog meta-query family) ---
# The root meta queries (_catalog / _module / _dataObject / _function) are
# declared on the Query type above; they are resolved on the metadata path,
# like __schema/__type, and never planned as data queries.

"""
The kind of a data object.
"""
enum _DataObjectType @system {
	TABLE
	VIEW
}

"""
The kind of a callable module member.
"""
enum _FunctionType @system {
	FUNCTION
	MUTATION
	SUBSCRIPTION
}

"""
The perspective of a relation entry: FORWARD — the viewed object is the source
of the edge; BACK — the viewed object is the destination.
"""
enum _RelationDirection @system {
	FORWARD
	BACK
}

"""
The nature of a relation edge. JOIN edges are one-directional (always FORWARD).
"""
enum _RelationKind @system {
	FK
	M2M
	JOIN
}

"""
A node in hugr's logical module tree. The root module has name "" and owns
everything attached directly to Query/Mutation/Subscription/Function/MutationFunction.
"""
type _Module @system {
	"""Full dotted module name; empty string for the root module."""
	name: String!
	description: String
	"""Curated/summarized long description."""
	longDescription: String
	"""Distinct data sources contributing this module's direct members."""
	dataSources: [String!]!
	"""Direct child modules only; children with no visible content are omitted."""
	modules: [_Module!]
	"""Data objects whose @module is this module (root: objects without @module)."""
	dataObjects: [_DataObject!]
	"""All callable members, including SUBSCRIPTION kind."""
	functions: [_Function!]
	"""The module's generated query root type (root module: Query)."""
	queryType: __Type
	"""The module's generated mutation root type (root module: Mutation)."""
	mutationType: __Type
	"""The module's generated subscription root type (root module: Subscription)."""
	subscriptionType: __Type
	"""The module's generated function root type (root module: Function)."""
	functionType: __Type
	"""The module's generated mutation-function root type (root module: MutationFunction)."""
	mutationFunctionType: __Type
}

"""
Extensible property flags of a data object. Adding a flag is a backward-compatible change.
"""
type _DataObjectProperties @system {
	"""Declared as an aggregation cube (@cube)."""
	isCube: Boolean!
	"""A many-to-many junction table (@table(is_m2m: true))."""
	isM2M: Boolean!
	"""A hypertable (@hypertable)."""
	isHypertable: Boolean!
	"""Soft-delete semantics enabled (@table(soft_delete: true))."""
	softDelete: Boolean!
	"""Has Vector-typed fields (semantic search capable)."""
	hasVectors: Boolean!
}

"""
A table or view as a logical entity of the hugr data model.
"""
type _DataObject @system {
	"""GraphQL type name (source-prefixed, globally unique)."""
	name: String!
	type: _DataObjectType!
	properties: _DataObjectProperties!
	description: String
	longDescription: String
	"""Owning module's dotted name; empty string for the root module."""
	moduleName: String!
	"""Owning module (recursive back-reference, depth-budgeted)."""
	module: _Module
	"""Field names carrying @pk; empty when the object has no primary key."""
	primaryKey: [String!]!
	"""Parameterized-view arguments; null when the object is not parameterized."""
	args: [__InputValue!]
	"""The object's fields (permission-filtered, same rules as __Type.fields)."""
	fields: [__Field!]
	"""Logical links to other data objects (both directions; hidden endpoints excluded)."""
	relations: [_Relation!]
	"""The OWNING data source."""
	dataSourceName: String!
	"""All contributing sources: owner + declarers of extension-added fields."""
	dataSources: [String!]!
}

"""
One perspective on a logical edge between two data objects. Relation SQL is never exposed.
"""
type _Relation @system {
	"""Relation name (@references(name:)) or the join field name."""
	name: String!
	direction: _RelationDirection!
	kind: _RelationKind!
	"""The field on the VIEWED object that materializes this edge."""
	fieldName: String
	"""Per-endpoint description (same perspective rule as fieldName)."""
	description: String
	"""The FAR data object (for M2M: the far leg, not the junction)."""
	dataObject: _DataObject
	"""M2M only: the junction data object; null otherwise."""
	through: _DataObject
	"""Key field mappings on the source side (M2M: the source junction leg)."""
	sourceKeys: [String!]!
	"""Key field mappings on the destination side (M2M: the destination junction leg)."""
	destinationKeys: [String!]!
	"""The data source declaring this edge (cross-source edges are visible)."""
	dataSource: String
}

"""
A callable member of a module: a query function, a mutation, or a subscription.
"""
type _Function @system {
	"""Field name on the module's function/mutation-function/subscription root type."""
	name: String!
	type: _FunctionType!
	description: String
	longDescription: String
	"""Owning module's dotted name; empty string for root-level functions."""
	moduleName: String!
	"""Owning module (recursive back-reference, depth-budgeted)."""
	module: _Module
	"""Client-facing arguments; server-injected @arg_default arguments are excluded."""
	args: [__InputValue!]
	returns: __Type
	"""True when the function returns a row set (table function) rather than a scalar."""
	isTable: Boolean!
	"""The owning data source."""
	dataSourceName: String
}