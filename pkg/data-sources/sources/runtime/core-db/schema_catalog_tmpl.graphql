# --- Arguments ---

"Schema field arguments"
type arguments @view(name: "_schema_arguments")
  @module(name: "catalog")
  @references(
    name: "args_field_ref"
    source_fields: ["type_name", "field_name"]
    references_fields: ["type_name", "name"]
    references_name: "fields"
    query: "field"
    description: "The field this argument belongs to"
    references_query: "arguments"
    references_description: "Arguments of this field"
  ) {
  type_name: String! @pk
  field_name: String! @pk
  name: String! @pk
  description: String!
  arg_type: String!
  arg_type_name: String! @field_references(
    name: "args_type_ref"
    field: "name"
    references_name: "types"
    query: "argument_type"
    description: "The type of this argument"
    references_query: "argument_usages"
    references_description: "Arguments with this type"
  )
  is_list: Boolean!
  is_non_null: Boolean!
  default_value: String
  "GraphQL directives applied to this argument, as a JSON array."
  directives: JSON
  """
  True if this argument is server-injected via @arg_default — its value comes
  from a context placeholder (like [$auth.user_id]) and clients cannot set it.
  Hidden from MCP discovery and GraphQL introspection at the engine level.
  """
  is_arg_default: Boolean! @sql(exp: "{{ if .IsPostgres }}directives::TEXT LIKE '%\"name\":\"arg_default\"%'{{ else }}CAST(directives AS VARCHAR) LIKE '%\"name\":\"arg_default\"%'{{ end }}")
}

